<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nivra Image Upload Test</title>
</head>
<body>

<h2>Nivra Image Upload Test</h2>

<label>
    JWT Token:
    <br>
    <textarea id="token" rows="6" cols="80"
        placeholder="Paste your JWT token here"></textarea>
</label>

<br><br>

<label>
    Image:
    <input type="file" id="file" accept="image/*">
</label>

<br><br>

<button onclick="uploadImage()">Upload Image</button>

<pre id="result"></pre>

<script>
async function uploadImage() {

    const token = document.getElementById("token").value.trim();
    const fileInput = document.getElementById("file");
    const result = document.getElementById("result");

    if (!token) {
        result.textContent = "Please paste your JWT token.";
        return;
    }

    if (!fileInput.files.length) {
        result.textContent = "Please select an image.";
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    result.textContent = "Uploading...";

    try {

        const response = await fetch(
            "http://localhost:8080/api/issues/2/image",
            {
                method: "POST",

                headers: {
                    "Authorization": "Bearer " + token
                },

                body: formData
            }
        );

        const text = await response.text();

        result.textContent =
            "HTTP " + response.status + "\n\n" + text;

    } catch (error) {

        result.textContent =
            "Request failed:\n" + error;
    }
}
</script>

</body>
</html>
