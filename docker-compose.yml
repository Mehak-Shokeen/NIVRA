services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: nivra-postgres
    environment:
      POSTGRES_DB: nivra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nivra_db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nivra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nivra-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nivra-backend
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: nivra_db_password
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nivra
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: nivra-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
